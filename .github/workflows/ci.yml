name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
      # Integration tests (idempotent upserts, revisions, backfill resume) run against this
      # service and must not silently skip.
      REQUIRE_POSTGRES: "1"
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Coverage threshold (80%) is enforced by [tool.coverage.report] fail_under.
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
