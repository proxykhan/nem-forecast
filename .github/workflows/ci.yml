name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # Integration tests skip here until Phase 5 adds a Postgres service container.
      # Coverage threshold (80%) is enforced by [tool.coverage.report] fail_under.
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
