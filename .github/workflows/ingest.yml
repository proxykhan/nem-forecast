name: Ingest and forecast

# Every half-hour: pull the latest 5-minute dispatch data from NEMWeb into Neon, then ask the live
# API for a forecast from the newest complete half-hour, the way a trading desk polls its
# forecast. The API logs every forecast it serves, and those logged forecasts are what the daily
# monitor scores against actuals, so this job is also the system's steady source of traffic.
#
# Half-hourly runs read from the latest interval already loaded (up to 48 hours back), so a run
# GitHub starts late, or a stretch of runs it skips, is caught up rather than left as a gap; on
# this repository scheduled runs have started up to 5.6 hours late, and some never. Every 6
# hours a run re-reads the whole last day for revisions. The loader is idempotent, so reading an
# interval twice is free.
#
# NOTE: GitHub disables scheduled workflows in public repositories after 60 days without
# repository activity. If ingestion silently stops, re-enable this workflow in the Actions tab
# (or push any commit), then run `nem-forecast backfill` to fill the gap from the monthly files.

on:
  schedule:
    - cron: "4,34 * * * *" # just after each half-hour's last 5-minute interval is published
    - cron: "17 */6 * * *" # the 24-hour catch-up read
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of history to ingest (NEMWeb Current keeps about 48)"
        default: "24"
        required: true

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: ci
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Manual: the requested window. 6-hourly: the last day. Half-hourly: since the latest data.
      INGEST_ARGS: >-
        ${{ inputs.hours && format('--hours {0}', inputs.hours)
        || (github.event.schedule == '17 */6 * * *' && '--hours 24' || '--since-latest --hours 48') }}
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Apply migrations
        run: uv run nem-forecast migrate

      - name: Ingest
        run: |
          # shellcheck disable=SC2086 # INGEST_ARGS is a list of flags
          uv run nem-forecast ingest $INGEST_ARGS --region VIC1

      - name: Request the latest forecast
        if: env.SERVICE_URL != ''
        # A free Render instance may be asleep. Waking it takes 1-1.5 minutes, during which its
        # proxy answers 502, so wait (up to 4 minutes) until it reports ready, then ask.
        run: |
          for _ in $(seq 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SERVICE_URL/ready" || true)
            if [ "$code" = 200 ]; then break; fi
            echo "service not ready yet (HTTP $code); waiting"
            sleep 10
          done
          curl -fsS --max-time 150 --retry 3 --retry-delay 20 --retry-all-errors \
            "$SERVICE_URL/forecast/latest" -o latest.json
          echo "Forecast from $(jq -r .forecast_origin latest.json), model $(jq -r .model_version latest.json), $(jq '.points | length' latest.json) half-hours" \
            | tee -a "$GITHUB_STEP_SUMMARY"
